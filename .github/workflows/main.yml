
name: Analyze K2P Firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binwalk squashfs-tools

      - name: Inspect firmware
        shell: bash
        run: |
          set -eu
          mkdir -p reports extracted

          find . -type f -name '*.bin' \
            -not -path './.git/*' \
            -print0 > /tmp/files

          test -s /tmp/files || {
            echo "No firmware files found"
            exit 1
          }

          while IFS= read -r -d '' fw; do
            base=$(basename "$fw" .bin)
            safe=$(printf '%s' "$base" |
              tr -cs 'A-Za-z0-9._-' '_')

            {
              echo "FILE: $fw"
              stat -c 'SIZE: %s bytes' "$fw"
              sha256sum "$fw"
              binwalk "$fw" || true
            } > "reports/$safe.txt"

            offset=$(binwalk "$fw" |
              awk '/Squashfs filesystem/ {print $1; exit}')

            if [ -n "${offset:-}" ]; then
              dd if="$fw" \
                of="extracted/$safe.squashfs" \
                bs=1 skip="$offset" status=none

              unsquashfs -s "extracted/$safe.squashfs" \
                >> "reports/$safe.txt" 2>&1 || true

              unsquashfs -ll "extracted/$safe.squashfs" \
                > "reports/$safe-files.txt" 2>&1 || true
            fi
          done < /tmp/files

      - name: Upload inspection reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: K2P-inspection-reports
          path: |
            reports/
            extracted/
          if-no-files-found: warn
